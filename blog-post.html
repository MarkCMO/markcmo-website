<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
<title id="page-title">Insights | Mark Gabrielli</title>
<meta id="meta-description" name="description" content="Insights from Mark Gabrielli, Fractional CMO." />
<link rel="canonical" id="canonical-link" href="https://markcmo.com/blog" />
<link rel="icon" type="image/webp" href="/favicon.webp" />
<link rel="stylesheet" href="/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" />
<style>
  body { background: #FFFFFF; color: #1E293B; font-family: 'Barlow', sans-serif; line-height: 1.7; }
  .post-container { max-width: 760px; margin: 0 auto; padding: 96px 24px 80px; }
  .post-eyebrow { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #C9A84C; font-weight: 700; margin-bottom: 16px; }
  .post-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.4rem, 5vw, 4rem); line-height: 1; letter-spacing: 0.02em; color: #0A1628; margin-bottom: 16px; }
  .post-subtitle { font-size: 1.2rem; color: #475569; margin-bottom: 32px; line-height: 1.5; font-weight: 500; }
  .post-meta { display: flex; gap: 16px; align-items: center; padding-bottom: 32px; border-bottom: 1px solid #E2E8F0; margin-bottom: 40px; flex-wrap: wrap; font-size: 13px; color: #64748B; }
  .post-meta strong { color: #0A1628; font-weight: 600; }
  .post-meta .pill { padding: 4px 12px; background: #EFF6FF; color: #C9A84C; border-radius: 999px; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .post-hero { width: 100%; max-height: 480px; object-fit: cover; border-radius: 14px; margin-bottom: 40px; }
  .post-content { font-size: 1.06rem; }
  .post-content h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.02em; color: #0A1628; margin: 56px 0 16px; line-height: 1.1; }
  .post-content h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.02em; color: #0A1628; margin: 40px 0 12px; line-height: 1.2; }
  .post-content p { margin-bottom: 1.4em; }
  .post-content a { color: #C9A84C; text-decoration: underline; text-underline-offset: 3px; }
  .post-content a:hover { color: #b8952f; }
  .post-content ul, .post-content ol { margin: 0 0 1.4em 28px; }
  .post-content li { margin-bottom: 8px; }
  .post-content blockquote { border-left: 4px solid #2563EB; padding: 8px 24px; margin: 32px 0; color: #475569; font-style: italic; background: #F8FAFC; border-radius: 0 8px 8px 0; }
  .post-content code { font-family: 'DM Mono', monospace; font-size: 0.9em; background: #F1F5F9; padding: 2px 6px; border-radius: 4px; color: #0A1628; }
  .post-content pre { background: #0A1628; color: #F8FAFC; padding: 20px 24px; border-radius: 10px; overflow-x: auto; margin: 32px 0; }
  .post-content pre code { background: none; color: inherit; padding: 0; }
  .post-content img { max-width: 100%; height: auto; border-radius: 10px; margin: 32px 0; }
  .post-tags { margin-top: 56px; padding-top: 32px; border-top: 1px solid #E2E8F0; display: flex; gap: 8px; flex-wrap: wrap; }
  .post-tag { padding: 6px 12px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 999px; font-family: 'DM Mono', monospace; font-size: 11px; color: #475569; letter-spacing: 1px; text-transform: lowercase; }
  .post-cta { margin-top: 64px; padding: 32px; background: linear-gradient(135deg, #2563EB, #1D4ED8); color: #FFFFFF; border-radius: 14px; text-align: center; }
  .post-cta h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 0.02em; margin-bottom: 12px; color: #FFFFFF; }
  .post-cta p { color: rgba(255,255,255,0.9); margin-bottom: 20px; }
  .post-cta a { display: inline-block; padding: 14px 28px; background: #F97316; color: #FFFFFF; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; text-decoration: none; border-radius: 8px; }
  .post-back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 32px; color: #C9A84C; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; font-family: 'DM Mono', monospace; }
  .post-back:hover { color: #b8952f; }
  .post-loading, .post-error { text-align: center; padding: 80px 20px; color: #64748B; }
  .post-loading { font-style: italic; }
  .post-error h2 { color: #DC2626; font-family: 'Bebas Neue', sans-serif; font-size: 2rem; margin-bottom: 12px; }
</style>
<meta name="author" content="Mark Gabrielli"/>
<link rel="author" href="https://markcmo.com/about.html"/>
</head>
<body>
  <div class="post-container">
    <a href="/blog" class="post-back">&larr; All Insights</a>
    <div id="post-root">
      <div class="post-loading">Loading post…</div>
    </div>
  </div>
  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const slug = params.get('slug') || location.pathname.replace(/.*\/blog\/?/, '').replace(/^\/+|\/+$/g, '');
      const root = document.getElementById('post-root');
      if (!slug) {
        root.innerHTML = '<div class="post-error"><h2>No post specified</h2><p>Add ?slug=your-post-slug to the URL.</p><p style="margin-top:24px;"><a href="/blog">Browse all insights</a></p></div>';
        return;
      }
      try {
        const res = await fetch(`/.netlify/functions/public-blog?action=single&slug=${encodeURIComponent(slug)}`);
        if (res.status === 404) {
          root.innerHTML = '<div class="post-error"><h2>Post not found</h2><p>This insight may have been unpublished or moved.</p><p style="margin-top:24px;"><a href="/blog">Browse all insights</a></p></div>';
          document.title = 'Not Found | MarkCMO';
          return;
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const { post } = await res.json();

        // Update <head>
        const escAttr = (s) => String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
        document.getElementById('page-title').textContent = (post.meta_title || `${post.title} | MarkCMO`);
        document.title = post.meta_title || `${post.title} | MarkCMO`;
        document.getElementById('meta-description').content = post.meta_description || post.excerpt || '';
        document.getElementById('canonical-link').href = `https://markcmo.com/blog/${post.slug}`;

        // Render
        const tags = (post.tags || []).map(t => `<span class="post-tag">#${escAttr(t)}</span>`).join('');
        const heroHtml = post.hero_image_url
          ? `<img class="post-hero" src="${escAttr(post.hero_image_url)}" alt="${escAttr(post.hero_image_alt || post.title)}" loading="eager" />`
          : '';
        const dateStr = post.published_at
          ? new Date(post.published_at).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })
          : '';
        const html = `
          <div class="post-eyebrow">${escAttr(post.category || 'insights')}</div>
          <h1 class="post-title">${escAttr(post.title)}</h1>
          ${post.subtitle ? `<div class="post-subtitle">${escAttr(post.subtitle)}</div>` : ''}
          <div class="post-meta">
            <span><strong>${escAttr(post.author_name || 'Mark Gabrielli')}</strong></span>
            ${dateStr ? `<span>${escAttr(dateStr)}</span>` : ''}
            <span>${post.read_time_min || 1} min read</span>
            <span class="pill">${escAttr(post.category || 'insights')}</span>
          </div>
          ${heroHtml}
          <div class="post-content">${post.content_html || ''}</div>
          ${tags ? `<div class="post-tags">${tags}</div>` : ''}
          <div class="post-cta">
            <h3>Need this kind of clarity for your business?</h3>
            <p>Mark works with founders and CEOs as a fractional CMO &amp; COO. Book a 30-minute call.</p>
            <a href="/book.html">Book a Free Call</a>
          </div>
        `;
        root.innerHTML = html;

        // JSON-LD for SEO
        const schema = document.createElement('script');
        schema.type = 'application/ld+json';
        schema.text = JSON.stringify({
          '@context': 'https://schema.org',
          '@type': 'BlogPosting',
          headline: post.title,
          description: post.meta_description || post.excerpt || '',
          image: post.hero_image_url || undefined,
          datePublished: post.published_at,
          dateModified: post.updated_at,
          author: { '@type': 'Person', name: post.author_name || 'Mark Gabrielli' },
          publisher: { '@type': 'Organization', name: 'MarkCMO', logo: { '@type': 'ImageObject', url: 'https://markcmo.com/mark-photo.webp' } },
          mainEntityOfPage: { '@type': 'WebPage', '@id': `https://markcmo.com/blog/${post.slug}` },
        });
        document.head.appendChild(schema);
      } catch (err) {
        root.innerHTML = `<div class="post-error"><h2>Failed to load</h2><p>${err.message}</p></div>`;
      }
    })();
  </script>
<script src="/linkedin-widget.js" defer></script>
</body>
</html>
