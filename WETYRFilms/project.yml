# XcodeGen project definition for WETYR Films.
# Generate the Xcode project on a Mac with:  xcodegen generate
# (install XcodeGen via:  brew install xcodegen)
#
# This file plus the Swift sources is enough to produce a buildable .xcodeproj.
# If you prefer not to use XcodeGen, see README.md for manual project setup steps.

name: WETYRFilms
options:
  bundleIdPrefix: com.wetyr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # set your Apple Developer Team ID here
    GENERATE_INFOPLIST_FILE: NO

targets:
  WETYRFilms:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WETYRFilms
    settings:
      base:
        INFOPLIST_FILE: WETYRFilms/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.wetyr.films
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad (universal)
        SUPPORTS_MACCATALYST: NO
    # NOTE: do NOT add an `info:` block here. INFOPLIST_FILE above points at the
    # hand-written Info.plist. An `info:` block would make XcodeGen generate and
    # overwrite it.
