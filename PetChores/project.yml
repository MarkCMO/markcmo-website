# XcodeGen project definition for Pet Chores.
# Generate the Xcode project on a Mac with:  xcodegen generate
# (install XcodeGen via:  brew install xcodegen)
#
# This file plus the Swift sources is enough to produce a buildable .xcodeproj.
# If you prefer not to use XcodeGen, see README.md for manual project setup steps.

name: PetChores
options:
  bundleIdPrefix: com.petchores
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # set your Apple Developer Team ID here
    GENERATE_INFOPLIST_FILE: NO

targets:
  PetChores:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PetChores
    settings:
      base:
        INFOPLIST_FILE: PetChores/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.petchores.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone and iPad (universal)
        SUPPORTS_MACCATALYST: NO
    # NOTE: do NOT add an `info:` block here. INFOPLIST_FILE above points at the
    # hand-written Info.plist (camera/photo usage strings, encryption key, launch
    # screen). An `info:` block would make XcodeGen generate and overwrite it.
    # No entitlements file is needed for a single StoreKit in-app purchase; add the
    # In-App Purchase capability in Xcode (Signing & Capabilities) before release.

  PetChoresTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
      # The seed JSON is copied into the test bundle so SeedContentTests can decode it
      # without needing an app test host.
      - path: PetChores/Resources/pet_database.json
        buildPhase: resources
    dependencies:
      - target: PetChores
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.petchores.tests
        GENERATE_INFOPLIST_FILE: YES
