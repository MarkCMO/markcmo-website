# ─── Netlify Configuration ───────────────────────────────────
[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# Auto-install missing function dependencies (e.g. pdf-parse)
[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# ─── Function Timeouts ────────────────────────────────────────
[functions.course-lesson]
  timeout = 10

[functions.course-exam]
  timeout = 10

# Find-email button runs deep-crawl + Wikipedia + (optional) Hunter
# inside film-rolodex.js → needs more than the 10s default.
[functions.film-rolodex]
  timeout = 26

# Expand pulls TMDB credit data for one page of titles per call.
[functions.film-rolodex-expand]
  timeout = 26

# ─── WETYR Studios - Script Dissector ─────────────────────────
# script-dissect: Claude Opus runs over full feature scripts (up to ~800k chars)
# and returns a complete tagged breakdown. Needs the full function timeout.
[functions.script-dissect]
  timeout = 26

# script-upload: PDF text extraction is fast; OCR fallback (Mistral) needs room.
[functions.script-upload]
  timeout = 26

# script-schedule: stripboard + day-out-of-days reasoning pass.
[functions.script-schedule]
  timeout = 26

# script-budget: top-sheet + line-item generation pass.
[functions.script-budget]
  timeout = 26

# ─── Scheduled Functions ──────────────────────────────────────
[functions.email-drip]
  schedule = "0 * * * *"

# Film rolodex auto-sync: every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
# Pulls fresh production-co + crew contacts from TMDB + SEC EDGAR into Blobs.
[functions.film-rolodex-cron]
  schedule = "0 */6 * * *"
  timeout = 30

# Deep-website crawl: daily at 09:00 UTC. Crawls 25 company sites per run on
# a round-robin cursor (covers all ~140 companies every ~6 days). Extracts
# emails, phones, named personnel + their titles, and production credits
# straight from About / Team / Leadership / Contact / Press pages.
[functions.film-rolodex-deep-cron]
  schedule = "0 9 * * *"
  timeout = 26

