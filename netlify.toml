# ─── Netlify Configuration ───────────────────────────────────
[build]
  publish = "."
  functions = "netlify/functions"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# ─── Function Timeouts ────────────────────────────────────────
[functions.course-lesson]
  timeout = 10

[functions.course-exam]
  timeout = 10

# ─── Scheduled Functions ──────────────────────────────────────
[functions.email-drip]
  schedule = "0 * * * *"

# Film rolodex auto-sync: every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
# Pulls fresh production-co + crew contacts from TMDB + SEC EDGAR into Blobs.
[functions.film-rolodex-cron]
  schedule = "0 */6 * * *"
  timeout = 30

