<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarkCMO Academy — Lesson Player</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
:root{--black:#060606;--surface:#0d0d0d;--card:#131313;--card2:#181818;--border:#1e1e1e;--border2:#252525;--gold:#C9A84C;--gold-dim:rgba(201,168,76,0.12);--gold-glow:rgba(201,168,76,0.35);--text:#f0f0f0;--dim:#777;--dim2:#555;--green:#4CAF72;--red:#e05555;--blue:#4a9eff;--sidebar:260px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--black);color:var(--text);font-family:'Barlow',sans-serif;font-size:15px;display:flex;flex-direction:column;cursor:none}
a{color:inherit;text-decoration:none}
#custom-cursor{position:fixed;width:36px;height:36px;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform 0.1s;overflow:hidden}
#custom-cursor img{width:100%;height:100%;object-fit:cover;border-radius:50%}
#custom-cursor.clicking{transform:translate(-50%,-50%) scale(0.82)}
html,body,*,*::before,*::after{cursor:none!important}

/* ── TOP BAR ───────────────────────────────────────────────────────────────── */
.top-bar{height:52px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:100}
.top-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:3px;color:var(--gold);white-space:nowrap}
.top-course-name{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.top-progress{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.top-prog-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.top-prog-fill{height:100%;background:var(--gold);transition:width 0.4s ease;border-radius:2px}
.top-prog-text{font-family:'DM Mono',monospace;font-size:11px;color:var(--dim);white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-sm{font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase;padding:6px 14px;border:1px solid var(--border2);color:var(--dim);background:none;transition:all 0.2s}
.btn-sm:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm-gold{background:var(--gold);color:#000;border-color:var(--gold)}
.btn-sm-gold:hover{background:#fff;border-color:#fff}

/* ── MAIN LAYOUT ───────────────────────────────────────────────────────────── */
.main-layout{flex:1;display:flex;overflow:hidden}

/* ── SIDEBAR ───────────────────────────────────────────────────────────────── */
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2)}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-header-label{font-size:9px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.sidebar-header-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;line-height:1.1}
.module-group{border-bottom:1px solid var(--border)}
.module-header{padding:10px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.module-header:hover{background:rgba(201,168,76,0.03)}
.module-num{font-family:'DM Mono',monospace;font-size:10px;color:var(--gold);width:18px;flex-shrink:0}
.module-title-text{font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--dim);flex:1;line-height:1.3}
.module-chevron{font-size:9px;color:var(--dim2);transition:transform 0.2s}
.module-group.open .module-chevron{transform:rotate(90deg)}
.module-group.open .module-title-text{color:var(--text)}
.module-lessons{display:none}
.module-group.open .module-lessons{display:block}
.lesson-item{padding:7px 16px 7px 42px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:background 0.1s;position:relative}
.lesson-item:hover{background:rgba(201,168,76,0.04)}
.lesson-item.active{background:var(--gold-dim);border-left:2px solid var(--gold)}
.lesson-item.active .lesson-title-nav{color:var(--gold)}
.lesson-item.completed .lesson-status-icon{color:var(--green)}
.lesson-item.locked{opacity:0.4;pointer-events:none}
.lesson-status-icon{font-size:11px;flex-shrink:0;width:14px;text-align:center;color:var(--dim2)}
.lesson-title-nav{font-size:12px;color:var(--dim);line-height:1.3;flex:1}
.sidebar-exam-btn{margin:16px;flex-shrink:0}
.exam-btn{width:100%;background:var(--gold);color:#000;border:none;padding:12px;font-family:'Barlow',sans-serif;font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;display:block;text-align:center;transition:all 0.2s;opacity:0.5}
.exam-btn.ready{opacity:1}
.exam-btn.ready:hover{background:#fff}

/* ── CONTENT AREA ──────────────────────────────────────────────────────────── */
.content-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.content-area::-webkit-scrollbar{width:6px}
.content-area::-webkit-scrollbar-thumb{background:var(--border2)}

/* ── STATES ────────────────────────────────────────────────────────────────── */
.state-loading,.state-welcome,.state-quiz,.state-complete{display:none;flex:1;flex-direction:column}
.state-loading.active,.state-welcome.active,.state-quiz.active,.state-complete.active{display:flex}

/* Welcome State */
.state-welcome{justify-content:center;align-items:center;padding:60px 40px;text-align:center}
.welcome-eyebrow{font-size:10px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:20px;border:1px solid rgba(201,168,76,0.3);padding:5px 14px;display:inline-block}
.welcome-title{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:2px;line-height:1;margin-bottom:16px}
.welcome-sub{color:var(--dim);max-width:480px;line-height:1.7;font-size:15px;margin-bottom:32px}
.welcome-stats{display:flex;gap:32px;justify-content:center;margin-bottom:40px;flex-wrap:wrap}
.welcome-stat{text-align:center}
.welcome-stat-val{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--gold);display:block;line-height:1}
.welcome-stat-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.welcome-name-form{background:var(--card);border:1px solid var(--border);padding:28px;max-width:420px;width:100%;margin:0 auto 24px}
.welcome-name-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.welcome-name-input{width:100%;background:var(--black);border:1px solid var(--border2);color:var(--text);font-family:'Barlow',sans-serif;font-size:15px;padding:12px 14px;outline:none;transition:border-color 0.2s}
.welcome-name-input:focus{border-color:var(--gold)}
.welcome-start-btn{background:var(--gold);color:#000;border:none;padding:14px 36px;font-family:'Barlow',sans-serif;font-size:12px;font-weight:900;letter-spacing:3px;text-transform:uppercase;width:100%;margin-top:16px;transition:all 0.2s}
.welcome-start-btn:hover{background:#fff}

/* Loading State */
.state-loading{justify-content:center;align-items:center;gap:20px}
.loading-spinner{width:48px;height:48px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);font-family:'DM Mono',monospace}
.loading-dots::after{content:'...';animation:dots 1.5s steps(4,end) infinite}
@keyframes dots{0%,20%{content:''}40%{content:'.'}60%{content:'..'}80%,100%{content:'...'}}

/* Lesson Content */
.lesson-view{flex:1;max-width:820px;margin:0 auto;padding:48px 40px;width:100%}
.lesson-breadcrumb{font-size:11px;color:var(--dim);margin-bottom:20px;display:flex;align-items:center;gap:6px}
.lesson-breadcrumb span{color:var(--gold)}
.lesson-meta-bar{display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.lesson-module-badge{font-size:9px;font-weight:900;letter-spacing:3px;text-transform:uppercase;background:var(--gold);color:#000;padding:4px 10px}
.lesson-time{font-size:11px;color:var(--dim);font-family:'DM Mono',monospace}
.lesson-title{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:1px;line-height:1.05;margin-bottom:8px}
.lesson-subtitle{font-size:15px;color:var(--dim);margin-bottom:32px;font-style:italic}
.lesson-key-concepts{background:var(--card);border-left:3px solid var(--gold);padding:16px 20px;margin-bottom:32px}
.lesson-key-concepts-label{font-size:9px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.lesson-key-concepts-list{display:flex;gap:8px;flex-wrap:wrap}
.concept-tag{font-size:11px;background:var(--gold-dim);border:1px solid rgba(201,168,76,0.25);padding:3px 10px;color:var(--text)}
.lesson-body{line-height:1.85;color:#d8d8d8}
.lesson-body h2{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;color:var(--text);margin:36px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.lesson-body h3{font-size:16px;font-weight:700;color:var(--text);margin:24px 0 10px}
.lesson-body p{margin-bottom:16px;font-size:15px}
.lesson-body ul,.lesson-body ol{padding-left:24px;margin-bottom:16px}
.lesson-body li{margin-bottom:6px;font-size:15px}
.lesson-body blockquote{border-left:3px solid var(--gold);padding:12px 20px;margin:20px 0;background:var(--card);font-style:italic;color:var(--dim)}
.lesson-body blockquote strong{color:var(--gold);font-style:normal}
.lesson-body strong{color:var(--text)}
.lesson-body em{color:var(--gold)}
.application-box{background:var(--card);border:1px solid var(--border2);border-left:3px solid var(--blue);padding:20px 24px;margin:32px 0}
.application-label{font-size:9px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.application-text{font-size:14px;line-height:1.7;color:var(--dim)}
.lesson-footer{border-top:1px solid var(--border);margin-top:48px;padding-top:32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.take-quiz-btn{background:var(--gold);color:#000;border:none;padding:14px 32px;font-family:'Barlow',sans-serif;font-size:12px;font-weight:900;letter-spacing:3px;text-transform:uppercase;transition:all 0.2s}
.take-quiz-btn:hover{background:#fff}

/* ── QUIZ STATE ────────────────────────────────────────────────────────────── */
.state-quiz{padding:48px 40px;max-width:820px;margin:0 auto;width:100%}
.quiz-header{margin-bottom:32px}
.quiz-eyebrow{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.quiz-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px}
.quiz-subtitle{font-size:13px;color:var(--dim);margin-top:6px}
.quiz-progress{display:flex;align-items:center;gap:12px;margin:20px 0}
.quiz-prog-bar{flex:1;height:3px;background:var(--border);border-radius:2px}
.quiz-prog-fill{height:100%;background:var(--gold);transition:width 0.3s;border-radius:2px}
.quiz-q-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--dim);white-space:nowrap}
.quiz-question-card{background:var(--card);border:1px solid var(--border);padding:28px;margin-bottom:16px}
.quiz-q-num{font-size:10px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.quiz-q-text{font-size:16px;font-weight:600;line-height:1.6;margin-bottom:20px}
.quiz-options{display:flex;flex-direction:column;gap:10px}
.quiz-option{background:var(--card2);border:1px solid var(--border2);padding:13px 18px;display:flex;align-items:flex-start;gap:12px;transition:all 0.15s;cursor:pointer;text-align:left;width:100%}
.quiz-option:hover:not(.selected):not(.correct):not(.wrong){border-color:rgba(201,168,76,0.3);background:rgba(201,168,76,0.03)}
.quiz-option.selected{border-color:var(--gold);background:var(--gold-dim)}
.quiz-option.correct{border-color:var(--green);background:rgba(76,175,114,0.1)}
.quiz-option.wrong{border-color:var(--red);background:rgba(224,85,85,0.08)}
.quiz-opt-letter{font-family:'DM Mono',monospace;font-size:12px;color:var(--gold);font-weight:700;flex-shrink:0;margin-top:1px}
.quiz-opt-text{font-size:14px;color:var(--text);line-height:1.5}
.quiz-explanation{background:rgba(76,175,114,0.08);border:1px solid rgba(76,175,114,0.2);padding:16px 20px;margin-top:12px;display:none}
.quiz-explanation.show{display:block}
.quiz-explanation-label{font-size:9px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:var(--green);margin-bottom:8px}
.quiz-explanation-text{font-size:13px;color:var(--dim);line-height:1.7}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
.quiz-btn{font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;padding:11px 24px;border:1px solid var(--border2);background:none;color:var(--dim);transition:all 0.2s}
.quiz-btn:hover{border-color:var(--gold);color:var(--gold)}
.quiz-btn-primary{background:var(--gold);color:#000;border-color:var(--gold)}
.quiz-btn-primary:hover{background:#fff;border-color:#fff}
.quiz-results{text-align:center;padding:40px}
.quiz-results-score{font-family:'Bebas Neue',sans-serif;font-size:80px;line-height:1;color:var(--gold)}
.quiz-results-label{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:16px}
.quiz-results-pass{color:var(--green);font-size:18px;font-weight:700;margin-bottom:8px}
.quiz-results-fail{color:var(--red);font-size:18px;font-weight:700;margin-bottom:8px}
.quiz-results-sub{color:var(--dim);font-size:13px;margin-bottom:24px}
.quiz-continue-btn{background:var(--gold);color:#000;border:none;padding:14px 36px;font-family:'Barlow',sans-serif;font-size:12px;font-weight:900;letter-spacing:3px;text-transform:uppercase;transition:all 0.2s}
.quiz-continue-btn:hover{background:#fff}

/* ── TOAST ─────────────────────────────────────────────────────────────────── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--border2);padding:12px 20px;font-size:12px;z-index:9000;transform:translateY(100px);opacity:0;transition:all 0.3s;max-width:320px}
.toast.show{transform:translateY(0);opacity:1}
.toast.gold{border-color:var(--gold);color:var(--gold)}
.toast.green{border-color:var(--green);color:var(--green)}
.toast.red{border-color:var(--red);color:var(--red)}

/* ── VIDEO SLOT ────────────────────────────────────────────────────────────── */
.video-slot{background:var(--card);border:1px dashed var(--border2);padding:24px;margin-bottom:28px;display:flex;align-items:center;gap:16px}
.video-slot-icon{font-size:28px;flex-shrink:0}
.video-slot-text h4{font-size:13px;font-weight:700;margin-bottom:4px}
.video-slot-text p{font-size:12px;color:var(--dim)}

@media(max-width:768px){
  .sidebar{display:none}
  .lesson-view,.state-quiz{padding:32px 20px}
  .lesson-title{font-size:36px}
}
</style>

</div>

// ── STATE ──────────────────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const COURSE_ID = params.get('course') || 'cmo';
const TOKEN = params.get('token') || '';
const EMAIL_PARAM = params.get('email') || '';
let STUDENT_NAME = localStorage.getItem('mcademy_name_' + COURSE_ID) || '';
let progress = JSON.parse(localStorage.getItem('mcademy_progress_' + COURSE_ID) || '{"completedLessons":[],"quizScores":{},"moduleScores":{},"currentModule":"m1","currentLesson":"l1"}');
let currentModule = null, currentLesson = null;
let currentLessonData = null;
let currentQuizAnswers = [];
let currentQuizIndex = 0;
let examUnlocked = false;

// ── COURSE DATA (mirrored from function) ───────────────────────────────────────
const COURSE_META = {
  // ── Top 5 Flagship ──────────────────────
  cfo:     {title:'Fractional CFO Mastery',               modules:10,lessons:50},
  cmo:     {title:'Fractional CMO Mastery',               modules:10,lessons:50},
  ae:      {title:'Account Executive Excellence',         modules:8, lessons:32},
  growth:  {title:'Growth Manager Mastery',               modules:8, lessons:32},
  vpsales: {title:'VP of Sales Mastery',                  modules:10,lessons:50},
  // ── Extended Library ────────────────────
  coo:         {title:'Fractional COO Mastery',               modules:10,lessons:50},
  digital:     {title:'Digital Marketing Mastery',            modules:10,lessons:40},
  linkedin:    {title:'LinkedIn Growth Machine',              modules:8, lessons:32},
  instagram:   {title:'Instagram for Business',               modules:8, lessons:32},
  revenue:     {title:'Revenue Architecture & GTM',           modules:10,lessons:50},
  category:    {title:'Category Design & Market Leadership',  modules:8, lessons:32},
  aimarketing: {title:'AI-Powered Marketing',                 modules:8, lessons:32},
  b2bdemand:   {title:'B2B Demand Generation',                modules:8, lessons:32},
  leadership:  {title:'Executive Leadership for Consultants', modules:8, lessons:32},
};

// Module/lesson counts per course
const COURSE_STRUCTURE = {
  cmo:{modules:Array.from({length:10},(_,i)=>({id:`m${i+1}`,lessons:5}))},

// ── INIT ───────────────────────────────────────────────────────────────────────
async function init() {
  const meta = COURSE_META[COURSE_ID];
  if(!meta) { toast('Invalid course', 'red'); return; }

  // ── ENROLLMENT GATE ──────────────────────────────────────────────────────
  // If token='demo' or no email — check if user has previously validated (stored locally)
  const storedToken  = localStorage.getItem('mcademy_token_' + COURSE_ID) || '';
  const storedEmail  = localStorage.getItem('mcademy_email_' + COURSE_ID) || '';
  const activeToken  = TOKEN || storedToken;
  const activeEmail  = EMAIL_PARAM || storedEmail;

  if (activeToken && activeToken !== 'demo' && activeEmail) {
    // Validate token server-side (non-blocking: allow on network failure)
    try {
      const r = await fetch(`/.netlify/functions/course-enroll?email=${encodeURIComponent(activeEmail)}&courseId=${COURSE_ID}&token=${activeToken}`);
      const d = await r.json();
      if (d.enrolled) {
        // Save for future visits
        localStorage.setItem('mcademy_token_' + COURSE_ID, activeToken);
        localStorage.setItem('mcademy_email_' + COURSE_ID, activeEmail);
        if (d.enrollment && d.enrollment.name && !STUDENT_NAME) {
          STUDENT_NAME = d.enrollment.name;
          localStorage.setItem('mcademy_name_' + COURSE_ID, STUDENT_NAME);
        }
        // Valid — continue to course
      } else if (d.reason === 'invalid_token') {
        // Token mismatch — clear stored and gate
        localStorage.removeItem('mcademy_token_' + COURSE_ID);
        localStorage.removeItem('mcademy_email_' + COURSE_ID);
        showAccessGate(COURSE_ID);
        return;
      }
      // If enrolled=false but no reason (network/server issue), allow through
    } catch(e) {
      // Network error — allow through to not block paying students
      console.warn('Enrollment check failed (network):', e);
    }
  } else if (!activeToken || activeToken === 'demo') {
    // No token at all — show access gate
    showAccessGate(COURSE_ID);
    return;
  }
  // ── END GATE ─────────────────────────────────────────────────────────────

  document.title = 'MarkCMO Academy — ' + meta.title;
  document.getElementById('top-course-name').textContent = meta.title;
  document.getElementById('sidebar-course-title').textContent = meta.title;
  document.getElementById('welcome-title').textContent = meta.title.toUpperCase();
  document.getElementById('welcome-modules').textContent = meta.modules;
  document.getElementById('welcome-lessons').textContent = meta.lessons;

  if(STUDENT_NAME) {
    document.getElementById('student-name-input').value = STUDENT_NAME;
  }

  renderSidebar();
  updateProgress();

  // If already started, skip welcome
  if(STUDENT_NAME && progress.completedLessons.length > 0) {
    const first = getFirstIncompleteLesson();
    if(first) loadLesson(first.mod, first.les);
    else showWelcome();
  }
}

function showAccessGate(courseId) {
  // Redirect to welcome page to claim access
  window.location.href = `/courses/welcome?course=${courseId}`;
}

function showWelcome() {
  hideAll();
  document.getElementById('state-welcome').classList.add('active');
}

function hideAll() {
  ['state-welcome','state-loading'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById('lesson-view-container').innerHTML = '';
  document.getElementById('state-quiz').innerHTML = '';
  document.getElementById('state-quiz').classList.remove('active');
}

function beginCourse() {
  const nameInput = document.getElementById('student-name-input').value.trim();
  if(!nameInput) { toast('Please enter your name for your diploma', 'red'); return; }
  STUDENT_NAME = nameInput;
  localStorage.setItem('mcademy_name_' + COURSE_ID, STUDENT_NAME);
  loadLesson('m1', 'l1');
}

// ── SIDEBAR ────────────────────────────────────────────────────────────────────
function renderSidebar() {
  const struct = COURSE_STRUCTURE[COURSE_ID];
  const names = MODULE_NAMES[COURSE_ID] || [];
  if(!struct) return;

  let html = '';
  struct.modules.forEach((mod, mi) => {
    const modName = names[mi] || `Module ${mi+1}`;
    const isOpen = mod.id === (progress.currentModule || 'm1');
    const modCompleted = isModuleComplete(mod.id, mod.lessons);
    html += `<div class="module-group${isOpen ? ' open' : ''}" id="modgroup-${mod.id}">
      <div class="module-header" onclick="toggleModule('${mod.id}')">
        <div class="module-num">M${mi+1}</div>
        <div class="module-title-text">${modName}</div>
        <div class="module-chevron">▶</div>
      </div>
      <div class="module-lessons">`;
    
    for(let li = 1; li <= mod.lessons; li++) {
      const lesId = `l${li}`;
      const lesKey = `${mod.id}_${lesId}`;
      const completed = progress.completedLessons.includes(lesKey);
      const isActive = progress.currentModule === mod.id && progress.currentLesson === lesId;
      const isLocked = isLessonLocked(mod.id, lesId, mi, li);
      html += `<div class="lesson-item${completed?' completed':''}${isActive?' active':''}${isLocked?' locked':''}" 
        onclick="loadLesson('${mod.id}','${lesId}')" id="lesitem-${lesKey}">
        <div class="lesson-status-icon">${completed ? '✓' : isActive ? '▶' : isLocked ? '🔒' : '○'}</div>
        <div class="lesson-title-nav">Lesson ${li}</div>
      </div>`;
    }
    html += `</div></div>`;
  });
  document.getElementById('sidebar-modules').innerHTML = html;

  // Check exam eligibility
  checkExamEligibility();
}

function toggleModule(modId) {
  const el = document.getElementById('modgroup-' + modId);
  if(el) el.classList.toggle('open');
}

function isLessonLocked(modId, lesId, modIndex, lesIndex) {
  // First lesson of first module is always unlocked
  if(modIndex === 0 && lesIndex === 1) return false;
  // Previous lesson must be completed
  const prevKey = lesIndex === 1 
    ? `m${modIndex}_l${COURSE_STRUCTURE[COURSE_ID].modules[modIndex-1]?.lessons}`
    : `${modId}_l${lesIndex-1}`;
  return !progress.completedLessons.includes(prevKey) && !(lesIndex === 1 && modIndex === 0);
}

function isModuleComplete(modId, lessonCount) {
  for(let i = 1; i <= lessonCount; i++) {
    if(!progress.completedLessons.includes(`${modId}_l${i}`)) return false;
  }
  return true;
}

function getFirstIncompleteLesson() {
  const struct = COURSE_STRUCTURE[COURSE_ID];
  if(!struct) return null;
  for(const mod of struct.modules) {
    for(let li = 1; li <= mod.lessons; li++) {
      const key = `${mod.id}_l${li}`;
      if(!progress.completedLessons.includes(key)) return { mod: mod.id, les: `l${li}` };
    }
  }
  return null;
}

function checkExamEligibility() {
  const struct = COURSE_STRUCTURE[COURSE_ID];
  if(!struct) return;
  let totalLessons = 0, completedCount = 0;
  struct.modules.forEach(m => {
    totalLessons += m.lessons;
    for(let li = 1; li <= m.lessons; li++) {
      if(progress.completedLessons.includes(`${m.id}_l${li}`)) completedCount++;
    }
  });
  const pct = totalLessons ? completedCount / totalLessons : 0;
  examUnlocked = pct >= 0.8; // 80% complete to unlock exam
  const examBtn = document.getElementById('sidebar-exam-btn');
  const examTopBtn = document.getElementById('exam-top-btn');
  if(examBtn) examBtn.classList.toggle('ready', examUnlocked);
  if(examTopBtn) examTopBtn.style.display = examUnlocked ? 'block' : 'none';
}

// ── LOAD LESSON ────────────────────────────────────────────────────────────────
async function loadLesson(modId, lesId) {
  if(!STUDENT_NAME) { showWelcome(); return; }

  currentModule = modId; currentLesson = lesId;
  progress.currentModule = modId;
  progress.currentLesson = lesId;
  saveProgress();

  // Update sidebar active state
  document.querySelectorAll('.lesson-item').forEach(el => el.classList.remove('active'));
  const activeItem = document.getElementById(`lesitem-${modId}_${lesId}`);
  if(activeItem) { activeItem.classList.add('active'); activeItem.querySelector('.lesson-status-icon').textContent = '▶'; }

  // Show loading
  hideAll();
  document.getElementById('state-loading').classList.add('active');
  document.getElementById('loading-text').innerHTML = 'Loading lesson<span class="loading-dots"></span>';
  document.getElementById('loading-subtext').style.display = 'none';

  // Open module in sidebar
  document.querySelectorAll('.module-group').forEach(el => el.classList.remove('open'));
  const modGroup = document.getElementById('modgroup-' + modId);
  if(modGroup) modGroup.classList.add('open');

  // Get lesson number for display
  const modIdx = parseInt(modId.replace('m','')) - 1;
  const lesIdx = parseInt(lesId.replace('l',''));
  const sid = STUDENT_NAME.replace(/\s/g,'').slice(0,8) + Date.now().toString(36).slice(-4);

  try {
    const resp = await fetch(`/.netlify/functions/course-lesson?course=${COURSE_ID}&module=${modId}&lesson=${lesId}&sid=${sid}`);
    const data = await resp.json();
    if(!data.success) throw new Error(data.error || 'Failed to load lesson');
    currentLessonData = data;
    renderLesson(data);
  } catch(e) {
    hideAll();
    document.getElementById('lesson-view-container').innerHTML = `
      <div style="padding:60px;text-align:center;color:var(--red)">
        <div style="font-size:32px;margin-bottom:16px">⚠️</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;margin-bottom:12px">LESSON LOAD FAILED</div>
        <div style="color:var(--dim);margin-bottom:24px">${e.message}</div>
        <button class="take-quiz-btn" onclick="loadLesson('${modId}','${lesId}')">Retry</button>
      </div>`;
  }
}

// ── QUIZ ───────────────────────────────────────────────────────────────────────
let quizQuestions = [], quizUserAnswers = [], quizRevealed = [];

function startQuiz() {
  if(!currentLessonData?.data?.quiz) { toast('No quiz data', 'red'); return; }
  quizQuestions = currentLessonData.data.quiz;
  quizUserAnswers = new Array(quizQuestions.length).fill(-1);
  quizRevealed = new Array(quizQuestions.length).fill(false);
  currentQuizIndex = 0;

  hideAll();
  document.getElementById('state-quiz').classList.add('active');
  document.getElementById('content-area').scrollTop = 0;
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const q = quizQuestions[currentQuizIndex];
  const total = quizQuestions.length;
  const answered = quizUserAnswers[currentQuizIndex] !== -1;
  const revealed = quizRevealed[currentQuizIndex];

  document.getElementById('state-quiz').innerHTML = `
    <div class="quiz-header">
      <div class="quiz-eyebrow">Lesson Quiz — ${(MODULE_NAMES[COURSE_ID]||[])[parseInt(currentModule.replace('m',''))-1] || currentModule}</div>
      <div class="quiz-title">Test Your Understanding</div>
      <div class="quiz-subtitle">Score 60% or higher to mark this lesson complete. No shortcuts.</div>
    </div>
    <div class="quiz-progress">
      <div class="quiz-prog-bar"><div class="quiz-prog-fill" style="width:${((currentQuizIndex+1)/total)*100}%"></div></div>
      <div class="quiz-q-count">Question ${currentQuizIndex+1} of ${total}</div>
    </div>
    <div class="quiz-question-card">
      <div class="quiz-q-num">Question ${currentQuizIndex+1}</div>
      <div class="quiz-q-text">${q.question}</div>
      <div class="quiz-options">
        ${q.options.map((opt, i) => {
          let cls = '';
          if(revealed) {
            if(i === q.correct) cls = 'correct';
            else if(i === quizUserAnswers[currentQuizIndex]) cls = 'wrong';
          } else if(i === quizUserAnswers[currentQuizIndex]) cls = 'selected';
          return `<button class="quiz-option ${cls}" onclick="${revealed?'':'selectAnswer('+i+')'}" ${revealed?'disabled':''}>
            <span class="quiz-opt-letter">${['A','B','C','D'][i]})</span>
            <span class="quiz-opt-text">${opt.replace(/^[A-D]\)\s*/,'')}</span>
          </button>`;
        }).join('')}
      </div>
      <div class="quiz-explanation ${revealed?'show':''}">
        <div class="quiz-explanation-label">Explanation</div>
        <div class="quiz-explanation-text">${q.explanation}</div>
      </div>
    </div>
    <div class="quiz-nav">
      <button class="quiz-btn" onclick="backLesson()" style="${currentQuizIndex===0?'visibility:hidden':''}">← Back to Lesson</button>
      <div style="display:flex;gap:10px">
        ${answered && !revealed ? `<button class="quiz-btn quiz-btn-primary" onclick="revealAnswer()">Check Answer</button>` : ''}
        ${revealed && currentQuizIndex < total-1 ? `<button class="quiz-btn quiz-btn-primary" onclick="nextQuestion()">Next Question →</button>` : ''}
        ${revealed && currentQuizIndex === total-1 ? `<button class="quiz-btn quiz-btn-primary" onclick="submitQuiz()">Submit Quiz →</button>` : ''}
      </div>
    </div>`;
}

function selectAnswer(idx) {
  quizUserAnswers[currentQuizIndex] = idx;
  renderQuizQuestion();
}

function revealAnswer() {
  quizRevealed[currentQuizIndex] = true;
  renderQuizQuestion();
}

function nextQuestion() {
  currentQuizIndex++;
  renderQuizQuestion();
  document.getElementById('content-area').scrollTop = 0;
}

function backLesson() {
  hideAll();
  document.getElementById('lesson-view-container').innerHTML && document.getElementById('content-area').scrollTop === 0;
  renderLesson(currentLessonData);
}

function submitQuiz() {
  let correct = 0;
  quizQuestions.forEach((q, i) => { if(quizUserAnswers[i] === q.correct) correct++; });
  const score = Math.round((correct / quizQuestions.length) * 100);
  const passed = score >= 60;
  const lesKey = `${currentModule}_${currentLesson}`;

  // Save score
  progress.quizScores[lesKey] = score;
  if(passed && !progress.completedLessons.includes(lesKey)) {
    progress.completedLessons.push(lesKey);
  }
  saveProgress();

  // Show results
  document.getElementById('state-quiz').innerHTML = `
    <div class="quiz-results">
      <div class="quiz-results-label">Quiz Complete</div>
      <div class="quiz-results-score">${score}%</div>
      <div class="${passed?'quiz-results-pass':'quiz-results-fail'}">${passed ? '✅ Passed!' : '❌ Not Quite'}</div>
      <div class="quiz-results-sub">${correct} of ${quizQuestions.length} correct.${passed ? ' This lesson is marked complete.' : ' You need 60% to pass. Study the lesson again.'}</div>
      ${passed 
        ? `<button class="quiz-continue-btn" onclick="lessonComplete()">Continue →</button>`
        : `<button class="quiz-continue-btn" onclick="backLesson()">← Review Lesson</button>`
      }
    </div>`;
}

function lessonComplete() {
  renderSidebar(); // refresh checkmarks
  updateProgress();
  checkExamEligibility();

  // Find next lesson
  const next = getFirstIncompleteLesson();
  if(next) {
    toast('Lesson complete! Loading next...', 'green');
    setTimeout(() => loadLesson(next.mod, next.les), 800);
  } else {
    toast('All lessons complete! Ready for final exam.', 'gold');
    setTimeout(() => startExam(), 1200);
  }
}

// ── EXAM ───────────────────────────────────────────────────────────────────────
function startExam() {
  if(!examUnlocked && progress.completedLessons.length < 3) {
    toast('Complete at least 80% of lessons to unlock the final exam', 'red'); return;
  }
  location.href = `/courses/exam?course=${COURSE_ID}&token=${TOKEN}&name=${encodeURIComponent(STUDENT_NAME)}`;
}

// ── PROGRESS ───────────────────────────────────────────────────────────────────
function saveProgress() {
  localStorage.setItem('mcademy_progress_' + COURSE_ID, JSON.stringify(progress));
}

function updateProgress() {
  const struct = COURSE_STRUCTURE[COURSE_ID];
  if(!struct) return;
  let total = 0, done = 0;
  struct.modules.forEach(m => {
    total += m.lessons;
    for(let li = 1; li <= m.lessons; li++) {
      if(progress.completedLessons.includes(`${m.id}_l${li}`)) done++;
    }
  });
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('top-prog-fill').style.width = pct + '%';
  document.getElementById('top-prog-text').textContent = pct + '%';
}

// ── TOAST ───────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type='gold') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ── CURSOR ──────────────────────────────────────────────────────────────────────
(function(){
