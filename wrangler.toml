# wrangler.toml - Cloudflare Pages config for MarkCMO
name = "markcmo"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[vars]
SITE_URL = "https://markcmo.com"
NODE_ENV = "production"

[[kv_namespaces]]
binding = "BLOBS_DOCUMENTS"
id = "REPLACE_WITH_KV_ID"
