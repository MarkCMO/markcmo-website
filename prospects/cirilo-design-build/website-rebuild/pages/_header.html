<!-- ────────────────────────────────────────────────────────────
     Cirilo Design + Build - Shared Site Header
     Loaded by every page. Mark this file when changing nav.
     ──────────────────────────────────────────────────────────── -->
<a href="#main" class="skip-link">Skip to content</a>
<header class="site-header">
  <div class="container site-header-inner">
    <a href="/" class="site-brand" aria-label="Cirilo Design + Build home">
      <span class="wordmark">CIRILO</span>
      <span class="wordmark-sub">Design + Build</span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="/about">About</a>
      <a href="/custom-concrete-swimming-pools">Pools</a>
      <a href="/outdoor-living-spaces">Outdoor Living</a>
      <a href="/home-renovations-and-remodeling">Renovations</a>
      <a href="/home-additions">Additions</a>
      <a href="/portfolio">Portfolio</a>
      <a href="/book" class="btn btn-primary">Book Consultation</a>
    </nav>
    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<style>
  .site-header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(250, 247, 242, 0.96);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .site-header-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 1rem; padding-bottom: 1rem;
  }
  .site-brand { border-bottom: none; display: flex; flex-direction: column; line-height: 1; }
  .site-brand .wordmark { font-size: 1.8rem; letter-spacing: 0.16em; }
  .site-brand .wordmark-sub { font-size: 0.6rem; margin-top: 2px; }
  .site-nav { display: flex; align-items: center; gap: 1.75rem; }
  .site-nav a {
    font-family: var(--font-body); font-size: 0.92rem; font-weight: 500;
    color: var(--ink); border-bottom: none; letter-spacing: 0.02em;
  }
  .site-nav a:hover { color: var(--gold-dark); }
  .site-nav a.btn { padding: 0.6rem 1.2rem; font-size: 0.88rem; }
  .nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 0.5rem; flex-direction: column; gap: 5px; }
  .nav-toggle span { display: block; width: 24px; height: 2px; background: var(--ink); }
  @media (max-width: 860px) {
    .site-nav { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: stretch; padding: 1rem; background: var(--white); border-bottom: 1px solid var(--border); box-shadow: var(--shadow); }
    .site-nav.open { display: flex; }
    .nav-toggle { display: flex; }
  }
</style>
<script>
  document.querySelector('.nav-toggle')?.addEventListener('click', function() {
    const nav = document.querySelector('.site-nav');
    const open = nav.classList.toggle('open');
    this.setAttribute('aria-expanded', open);
  });
</script>
