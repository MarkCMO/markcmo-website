name: Deploy WETYR Arena (wetyr.com)

# WETYR Arena is a separate product on its own domain, deliberately kept off
# markcmo.com. This deploys the arena/ content to a dedicated Cloudflare Pages
# project named "wetyr". Arena is static (self-contained HTML/CSS/JS), so this
# is a plain static deploy, no KV catch-all needed.
#
# One-time setup before this runs cleanly: see prop-firm/WETYR-DOMAIN-SETUP.md
# (create the "wetyr" Pages project + attach the wetyr.com custom domain).

on:
  push:
    branches: [main]
    paths:
      - 'arena/**'
      - 'wetyr-static/**'
      - '.github/workflows/deploy-wetyr.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy wetyr.com/arena
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble wetyr-dist
        run: |
          set -e
          mkdir -p wetyr-dist
          cp -r arena wetyr-dist/arena
          cp wetyr-static/index.html  wetyr-dist/index.html
          cp wetyr-static/robots.txt  wetyr-dist/robots.txt
          # arena pages reference /favicon.* at the domain root
          if [ -f favicon.svg ];  then cp favicon.svg  wetyr-dist/; fi
          if [ -f favicon.webp ]; then cp favicon.webp wetyr-dist/; fi
          echo "Assembled wetyr-dist:"; find wetyr-dist -maxdepth 2 -type f | sort

      - name: "Deploy to Cloudflare Pages (project wetyr)"
        run: |
          npx wrangler@latest pages deploy wetyr-dist \
            --project-name wetyr \
            --branch main \
            --commit-hash "${{ github.sha }}" \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5b4ea6b5589fe12f29bea5d7e43fe03c
