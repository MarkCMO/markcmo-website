name: Deploy to Cloudflare Pages

# ── Trigger ──────────────────────────────────────────────────────────────────
# main    → production  (markcmo.com)       — full KV upload + deploy
# staging → preview URL (staging.markcmo.pages.dev) — CSS/functions only, no KV
on:
  push:
    branches: [main, staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy (${{ github.ref_name }})
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Step 1: Upload HTML pages to KV (production only) ────────────
      # HTML is excluded from the CF Pages static deploy to stay under the
      # 20,000-file limit.  The catch-all function reads KV at request time.
      # Staging skips this step — it reads from the same production KV so
      # all real page content is available while testing CSS/function changes.
      - name: Upload HTML pages to KV
        if: github.ref_name == 'main'
        run: node scripts/upload-html-to-kv.js
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_EMAIL: marklgabriellijr@gmail.com
          CLOUDFLARE_ACCOUNT_ID: 5b4ea6b5589fe12f29bea5d7e43fe03c
          KV_NAMESPACE_ID: 0340e4af3ed44224ac380d1d35014834

      # ── Step 2: Build static asset dist/ ────────────────────────────
      - name: Build dist/ and copy functions
        run: |
          node scripts/build-dist.js
          cp -r functions/ dist/functions/
          cp -r netlify/ dist/netlify/

      # ── Step 3: Deploy to Cloudflare Pages ──────────────────────────
      # main    → production branch  → markcmo.com
      # staging → staging branch     → staging.markcmo.pages.dev  (preview)
      - name: Sync Cloudflare Pages secrets (TMDB_API_KEY)
        continue-on-error: true
        run: |
          printf '%s' "$TMDB_API_KEY" | npx wrangler@latest pages secret put TMDB_API_KEY --project-name markcmo
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5b4ea6b5589fe12f29bea5d7e43fe03c

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler@latest pages deploy dist/ \
            --project-name markcmo \
            --branch "${{ github.ref_name }}" \
            --commit-hash "${{ github.sha }}" \
            --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5b4ea6b5589fe12f29bea5d7e43fe03c

      # ── Step 3.5: Purge CF edge cache for non-versioned assets ──────
      # /style.css, /components.js, /footer.html etc. ship without content
      # hashes in their URLs, so a static `immutable` cache hint can strand
      # the old file at the edge after the deploy. This script asks CF to
      # forcibly evict those URLs after every successful deploy. Production
      # only — staging runs at staging.markcmo.pages.dev which uses a
      # different zone (none) and doesn't need purging.
      - name: Purge Cloudflare edge cache
        if: github.ref_name == 'main'
        run: node scripts/purge-cf-cache.js
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_EMAIL: marklgabriellijr@gmail.com
          CLOUDFLARE_ACCOUNT_ID: 5b4ea6b5589fe12f29bea5d7e43fe03c

      # ── Step 4: Print preview URL for staging ───────────────────────
      - name: Print staging URL
        if: github.ref_name == 'staging'
        run: |
          echo ""
          echo "✅ Staging deployed!"
          echo "   Preview URL: https://staging.markcmo.pages.dev"
          echo "   (Hard-refresh with Ctrl+Shift+R to bypass cache)"
          echo ""
          echo "   To push to production:"
          echo "   git checkout main && git merge staging && git push origin main"
