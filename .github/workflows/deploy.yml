name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy markcmo.com to Cloudflare Pages
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deploy only git-tracked files via git archive to avoid the wrangler
      # 20,000-file limit (the .claude/ session directory is not in git but
      # wrangler's hardcoded ignore list doesn't exclude it in direct-upload mode)
      - name: Create clean deploy archive
        run: |
          mkdir -p /tmp/markcmo_deploy
          git archive HEAD | tar -x -C /tmp/markcmo_deploy

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler@latest pages deploy /tmp/markcmo_deploy \
            --project-name markcmo \
            --branch main \
            --commit-hash "${{ github.sha }}" \
            --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5b4ea6b5589fe12f29bea5d7e43fe03c
