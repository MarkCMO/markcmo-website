name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy markcmo.com to Cloudflare Pages
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Step 1: Upload all HTML pages to KV ─────────────────────────
      # HTML files are excluded from the static CF Pages deployment
      # (.cfignore has *.html) to stay under the 20,000-file limit.
      # The catch-all function (functions/[[path]].js) reads from this KV
      # namespace at request time to serve any HTML page.
      - name: Upload HTML pages to KV
        run: node scripts/upload-html-to-kv.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5b4ea6b5589fe12f29bea5d7e43fe03c
          KV_NAMESPACE_ID: 0340e4af3ed44224ac380d1d35014834

      # ── Step 2: Deploy static assets to Cloudflare Pages ────────────
      # Uses a clean git archive so no untracked workspace files leak in.
      # .cfignore (which includes *.html) is extracted into the archive
      # dir, so wrangler respects it and the static deploy stays <20K files.
      - name: Create clean deploy archive
        run: |
          mkdir -p /tmp/markcmo_deploy
          git archive HEAD | tar -x -C /tmp/markcmo_deploy

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler@latest pages deploy /tmp/markcmo_deploy \
            --project-name markcmo \
            --branch main \
            --commit-hash "${{ github.sha }}" \
            --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5b4ea6b5589fe12f29bea5d7e43fe03c
