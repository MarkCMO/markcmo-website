  - generic [ref=e145]:
    - generic [ref=e146]:
      - generic [ref=e147]: Why timing matters
      - heading "Why timing is everything for a Texas buyback" [level=2] [ref=e148]
      - paragraph [ref=e149]: The single biggest factor in how much a district recovers is not which devices it owns. It is when it sells them.
    - generic [ref=e150]:
      - paragraph [ref=e151]: Apple devices depreciate on a predictable curve. A MacBook Air or iPad holds a strong share of its value in the first two to three years, then the decline steepens as newer models arrive and supply of the older generation grows. For a Texas district, this curve interacts with two local realities. First, most districts refresh on a summer cadence, which means thousands of identical models hit the resale market at the same moment every year. Second, the fleets purchased during the remote and hybrid learning surge are now aging out together across the entire state, compounding that supply pressure.
      - paragraph [ref=e152]: The practical lesson is simple. A district that plans its buyback twelve to eighteen months ahead, and sells before the market floods with the same model, consistently recovers more per device than one that waits until devices are obsolete and stacked in a storage room. This is exactly why the Refresh Plan is built around timing, not just transactions. We map your fleet against the depreciation curve and tell you the optimal window to sell each cohort, so value goes back to your students instead of evaporating on a shelf.
      - paragraph [ref=e153]:
        - text: For districts winding down technology funded by one-time federal relief dollars, timing matters even more. Recovering residual value from those fleets can help bridge the gap as one-time funding ends and recurring budgets take over.
        - link "Ask us to model your district's depreciation timeline." [ref=e154] [cursor=pointer]:
          - /url: https://secondlifemac.com/get-a-quote/
  - generic [ref=e155]:
