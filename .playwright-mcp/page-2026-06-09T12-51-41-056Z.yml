          - heading "Valuation" [level=3] [ref=e65]
          - paragraph [ref=e66]: Send us your device inventory and we return a clear, itemized buyback estimate. We help you understand depreciation curves so you can time your refresh for maximum value, whether that is end of school year, end of lease, or the close of a one to one program.
        - generic [ref=e67]:
