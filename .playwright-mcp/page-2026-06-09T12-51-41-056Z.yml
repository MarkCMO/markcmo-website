      - generic [ref=e157]: Who we serve in Texas
      - heading "Texas institutions we partner with" [level=2] [ref=e158]
      - paragraph [ref=e159]: Public, charter, and higher education institutions across Texas use Second Life Mac to fund their refresh cycles. The program scales from a single campus to a statewide system.
    - generic [ref=e161]:
      - generic [ref=e162]:
        - heading "School districts" [level=3] [ref=e163]
        - paragraph [ref=e164]: From large urban districts to rural systems served by their regional Education Service Center, we handle district-wide one to one retirements, lab refreshes, and lease returns with documentation your business office and board can rely on.
      - generic [ref=e165]:
        - heading "Charter networks" [level=3] [ref=e166]
        - paragraph [ref=e167]: Multi-campus charter management organizations often run on tight, grant-driven budgets. Recovering value from retired Apple devices turns a sunk cost into reinvestable funding across the network.
      - generic [ref=e168]:
        - heading "Community colleges" [level=3] [ref=e169]
        - paragraph [ref=e170]: Texas community colleges cycle through MacBooks and iPads in labs, libraries, and lending programs. We help recover value at each refresh and keep data destruction defensible.
      - generic [ref=e171]:
        - heading "University systems" [level=3] [ref=e172]
        - paragraph [ref=e173]: Large Texas university systems manage Apple fleets across departments, residence halls, and research groups. We coordinate at scale while keeping each unit's reporting clean.
      - generic [ref=e174]:
        - heading "Private and magnet schools" [level=3] [ref=e175]
        - paragraph [ref=e176]: Independent and magnet programs use buyback proceeds to stretch technology budgets further and keep classroom devices current without raising tuition pressure.
      - generic [ref=e177]:
        - heading "Special education programs" [level=3] [ref=e178]
        - paragraph [ref=e179]: Assistive and adaptive Apple devices reach end of life too. We handle these with the same secure, documented care and return value to the programs that need it most.
  - generic [ref=e180]:
    - generic [ref=e181]:
      - generic [ref=e182]: Why a dedicated partner
      - heading "What sets Second Life Mac apart for Texas schools" [level=2] [ref=e183]
      - paragraph [ref=e184]: Districts have options when it comes time to retire Apple hardware. Here is what makes a dedicated buyback partner different from the alternatives.
    - generic [ref=e186]:
      - generic [ref=e187]:
        - heading "More value than a generic trade-in" [level=3] [ref=e188]
        - paragraph [ref=e189]: Manufacturer trade-in programs are convenient but typically return store credit at modest values. As an Apple device specialist that refurbishes and resells at scale, we are built to pay competitive, transparent prices, often more than a one-size-fits-all credit program, and we pay it back as budget you control.
      - generic [ref=e190]:
        - heading "Less work than doing it yourself" [level=3] [ref=e191]
        - paragraph [ref=e192]: "Selling devices piecemeal on the open market turns your team into a part-time resale operation: wiping, photographing, listing, shipping, and chasing payments. Our Touchless Trade-in and Blue Glove service remove all of that. You hand off the fleet, we handle everything, you get a report and a check."
      - generic [ref=e193]:
        - heading "More accountability than a recycler" [level=3] [ref=e194]
        - paragraph [ref=e195]: A pure recycler hauls devices away and may even charge for it. We treat your hardware as the asset it is, recover its value, and still recycle responsibly what cannot be resold, so you get funding and a clean sustainability story.
      - generic [ref=e196]:
        - heading "Experience that protects you" [level=3] [ref=e197]
        - paragraph [ref=e198]: "We have processed millions of Apple devices and served thousands of organizations. That experience shows up where it matters: accurate valuations, airtight data destruction documentation, and a process that does not break down at scale."
