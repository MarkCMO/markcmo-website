      - generic [ref=e58]: How it works
      - heading "The Refresh Plan, built for Texas" [level=2] [ref=e59]
      - paragraph [ref=e60]: Our process is built so a busy technology director never has to babysit a buyback. It is the same proven workflow we have run for thousands of organizations, adapted to the realities of Texas procurement and logistics.
