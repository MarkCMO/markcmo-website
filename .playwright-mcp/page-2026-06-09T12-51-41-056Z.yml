    - heading "The 2026 device wave is a Texas timing opportunity" [level=2] [ref=e142]
    - paragraph [ref=e143]: Texas is one of the largest one to one device markets in the country, and the fleets purchased during the remote and hybrid learning years are now aging out together. Districts that act before the wave peaks capture the strongest residual values, because resale prices soften as the market floods with identical models. Acting early is not just good operations, it is more money back into your classrooms.
