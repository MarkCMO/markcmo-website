          - heading "Secure processing" [level=3] [ref=e73]
          - paragraph [ref=e74]: At our U.S.-based facility, every device is cleaned, tested, graded, and erased to recognized data destruction standards, then logged by serial number. You receive a detailed audit report for your records and your board.
