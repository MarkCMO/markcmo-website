    - generic [ref=e48]:
      - generic [ref=e49]: Texas school technology funding
      - heading "Texas districts are sitting on millions in untapped budget" [level=2] [ref=e50]
      - paragraph [ref=e51]: When Texas schools deployed Apple devices at scale during the one to one and remote learning years, they built fleets that are now reaching the end of their useful classroom life. Those MacBook Airs, iPads, and Mac minis still hold real residual value, but only for a limited window. Every semester a device sits in a storage closet, its resale value depreciates and the chance to reinvest that value slips away.
    - generic [ref=e52]:
      - paragraph [ref=e53]: "Second Life Mac helps Texas school districts, charter networks, community colleges, and university systems recover that value and put it back where it belongs: in the classroom. We purchase your retired Apple devices outright, handle secure data erasure and logistics, and pay you a transparent price per device. The proceeds become budget you can apply toward your next purchase of MacBooks, iPads, or any other technology your students need."
      - paragraph [ref=e54]:
        - text: This is not a recycling program where you pay for disposal. It is a buyback partnership where retired hardware becomes a funding source. For a Texas district managing tens of thousands of devices across dozens of campuses, the difference can be hundreds of thousands of dollars per refresh cycle.
        - link "Learn more about our work with school districts." [ref=e55] [cursor=pointer]:
          - /url: https://secondlifemac.com/school-districts/
  - generic [ref=e56]:
