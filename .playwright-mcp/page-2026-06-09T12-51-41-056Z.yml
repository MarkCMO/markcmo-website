      - heading "Built for Texas compliance and Texas procurement" [level=2] [ref=e92]
      - paragraph [ref=e93]: Selling district hardware is not just a logistics question. It is a data privacy, records, and procurement question, and Texas has its own rules. Second Life Mac is built to make compliance the easy part.
