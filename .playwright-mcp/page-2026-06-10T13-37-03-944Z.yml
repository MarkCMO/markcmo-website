  - generic [ref=e139]:
    - generic [ref=e140]:
      - generic [ref=e141]: Two ways to structure it
      - heading "Choose how we get paid" [level=2] [ref=e142]
      - paragraph [ref=e143]: Apply either model to any tier above. One rewards predictability, the other ties my upside directly to the devices the engine brings in.
    - generic [ref=e145]:
      - generic [ref=e146]:
        - generic [ref=e147]: Model A · Performance
        - heading "Lower base, bonus on units acquired" [level=3] [ref=e148]
        - paragraph [ref=e149]: My incentive is aligned with your supply. We reduce the monthly retainer and add a bonus tied to the fleets the engine actually wins.
        - list [ref=e150]:
          - listitem [ref=e151]: – Monthly retainer reduced about 30% from the flat rate
          - listitem [ref=e152]: "– Plus a bonus, you choose the mechanism that fits your accounting:"
          - listitem [ref=e153]: – $1.50 per device acquired from a marketing-sourced account, OR
          - listitem [ref=e154]: – $1,500 per net-new fleet acquisition (a university or enterprise account that completes a buyback), scaling up for large fleets
          - listitem [ref=e155]: – Only marketing-sourced and marketing-influenced accounts count, tracked in Pardot
          - listitem [ref=e156]: – Monthly bonus capped at 1.5x the base retainer to protect your cash flow
        - paragraph [ref=e157]: Best when you want my compensation tied to results and you are confident in the volume opportunity.
      - generic [ref=e158]:
        - generic [ref=e159]: Model B · Flat
        - heading "Predictable engagement and retainer" [level=3] [ref=e160]
        - paragraph [ref=e161]: Simple, fixed, easy to budget. The one-time engagement fee plus a flat monthly retainer, with no per-unit component.
        - list [ref=e162]:
          - listitem [ref=e163]: – One-time systems build (engagement fee) as listed per tier
          - listitem [ref=e164]: – Flat monthly retainer as listed per tier
          - listitem [ref=e165]: – No per-device or per-account bonus
          - listitem [ref=e166]: – Fully predictable spend for finance and board planning
          - listitem [ref=e167]: – All systems, channels, and reporting included per tier
        - paragraph [ref=e168]: Best when finance prefers a fixed line item and clean forecasting.
