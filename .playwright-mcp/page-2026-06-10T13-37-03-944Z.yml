  - generic [ref=e16]:
    - generic [ref=e17]: Supply-Side Growth Proposal
    - heading "The Apple acquisition engine for Second Life Mac" [level=1] [ref=e18]
    - paragraph [ref=e19]: A built-for-you outreach system that wins more device fleets from universities and enterprises the moment they upgrade, before Diamond Assets gets there first.
    - generic [ref=e20]: Prepared for Scott Pauga and the Second Life Mac leadership team · Confidential
  - generic [ref=e21]:
    - generic [ref=e22]:
      - generic [ref=e23]: The objective
      - heading "Acquire more devices, from bigger fleets, more predictably" [level=2] [ref=e24]
      - paragraph [ref=e25]: "Blaine framed the goal clearly: Second Life Mac wants a repeatable acquisition funnel that brings in more Apple devices from universities and enterprise organizations as they refresh and upgrade their fleets. Today most of that supply comes from relationships, referrals, and inbound. That is valuable, but it is not a system, and it does not scale on demand."
    - generic [ref=e26]:
      - paragraph [ref=e27]: The opportunity in front of Second Life Mac is timing. Every university IT department and every enterprise running Mac fleets upgrades on a cycle. The window to win their old devices opens the moment they commit to new hardware, and it closes fast as competitors, trade-in programs, and recyclers move in. The company that systematically reaches those buyers at the upgrade moment wins the fleet. Right now, no one in this category does that at scale, including Diamond Assets, who grew through sales and partnerships rather than a built demand engine.
      - paragraph [ref=e28]: "This proposal lays out the acquisition engine I would build and run for you: the email infrastructure, the multichannel outreach, the data and targeting, and the senior leadership to operate it, structured so a meaningful share of the cost can be tied directly to the devices it brings in."
  - generic [ref=e29]:
    - generic [ref=e30]:
      - generic [ref=e31]: The strategy
      - heading "Reach the fleet at the upgrade moment" [level=2] [ref=e32]
      - paragraph [ref=e33]: We target university and enterprise accounts at the exact point they are retiring Apple hardware, using signals competitors ignore.
    - generic [ref=e35]:
      - generic [ref=e36]:
        - generic [ref=e37]: "1"
        - heading "Find the upgrade signal" [level=3] [ref=e38]
        - paragraph [ref=e39]: Lease expirations, end-of-life Apple models, new deployment announcements, fiscal year-end, grant and bond cycles, and refresh patterns flag accounts that are about to have fleets to sell.
      - generic [ref=e40]:
        - generic [ref=e41]: "2"
        - heading "Reach the right owner" [level=3] [ref=e42]
        - paragraph [ref=e43]: We build targeted lists of IT directors, asset managers, CIOs, and procurement leads at universities and enterprises, enriched and verified, not scraped and stale.
      - generic [ref=e44]:
        - generic [ref=e45]: "3"
        - heading "Open with value" [level=3] [ref=e46]
        - paragraph [ref=e47]: "The message is simple and strong: you upgraded, we pay you for the old fleet, securely and with zero hassle. Sequenced across email and LinkedIn until they respond."
      - generic [ref=e48]:
        - generic [ref=e49]: "4"
        - heading "Route to your team" [level=3] [ref=e50]
        - paragraph [ref=e51]: Qualified replies flow straight into Pardot and to your procurement team with full context, so nothing leaks and every fleet gets worked.
      - generic [ref=e52]:
        - generic [ref=e53]: "5"
        - heading "Multiply the channels" [level=3] [ref=e54]
        - paragraph [ref=e55]: Cold email and LinkedIn lead. Then we layer partnerships, retargeting, and the geo and segment SEO matrix so inbound compounds over time.
      - generic [ref=e56]:
        - generic [ref=e57]: "6"
        - heading "Measure and scale" [level=3] [ref=e58]
        - paragraph [ref=e59]: Every account is tracked from first touch to acquired fleet, so we know cost per acquired device and double down on what works.
  - generic [ref=e60]:
    - generic [ref=e61]:
      - generic [ref=e62]: What we build
      - heading "The systems, built and owned by you" [level=2] [ref=e63]
      - paragraph [ref=e64]: The engagement fee covers a real infrastructure build, not a slide deck. This is the machine that runs the outreach.
    - generic [ref=e66]:
      - generic [ref=e67]:
        - heading "Cold email infrastructure" [level=3] [ref=e68]
        - paragraph [ref=e69]: Dedicated secondary sending domains to protect your primary reputation, full authentication (SPF, DKIM, DMARC), provisioned and warmed mailboxes, a managed sending platform with inbox rotation, and continuous deliverability monitoring.
      - generic [ref=e70]:
        - heading "Targeting and data" [level=3] [ref=e71]
        - paragraph [ref=e72]: Enriched, verified contact lists of university and enterprise IT and procurement decision makers, plus upgrade-signal triggers (lease end, EOL models, deployments) so we reach fleets at the right moment.
      - generic [ref=e73]:
        - heading "Outreach sequences and copy" [level=3] [ref=e74]
        - paragraph [ref=e75]: Multi-step email and LinkedIn sequences written and tested for the acquisition message, with A/B testing built in so response rates climb over time.
      - generic [ref=e76]:
        - heading "LinkedIn engine" [level=3] [ref=e77]
        - paragraph [ref=e78]: A Sales Navigator and tooling workflow that runs connection and message sequences to the same target accounts in parallel with email.
      - generic [ref=e79]:
        - heading "CRM and routing" [level=3] [ref=e80]
        - paragraph [ref=e81]: Clean integration with Salesforce Pardot, lead scoring, and routing so qualified fleets land with your procurement team instantly and nothing falls through.
      - generic [ref=e82]:
        - heading "Dashboards and attribution" [level=3] [ref=e83]
        - paragraph [ref=e84]: "A single view from first touch to acquired fleet: accounts reached, replies, opportunities, devices acquired, and cost per acquired device, so spend is always tied to outcomes."
